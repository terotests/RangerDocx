<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RangerDocx</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      /* NO `@font-face` HERE, deliberately — see the note in
         gallery/pptx/web/standalone/index.html. `registerBrowserFaces` gives
         `document.fonts` the bytes the page already fetched. */
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #e9ebf0; }
      body { font-family: "Open Sans", "Segoe UI", sans-serif; color: #20242c; }
      /* The whole editor is one canvas: title bar, ribbon, panes, pages and
         status bar are drawn by the engine (DocxChrome), not by this page. */
      canvas { display: block; outline: none; touch-action: none; }
      /* What the self test and the smoke script read. Not furniture. */
      #debug { position: fixed; left: -10000px; top: 0; }
      #file { display: none; }
    </style>
  </head>
  <body>
    <canvas id="screen" tabindex="0" width="1280" height="800"></canvas>
    <input id="file" type="file" accept=".docx" />
    <div id="debug" aria-hidden="true">
      <span>page <strong id="slide">—</strong></span>
      <span>status: <strong id="status">starting…</strong></span>
      <span>backend: <strong id="backend">—</strong></span>
      <span>cmds: <strong id="cmds">—</strong></span>
      <!-- Which build this is: the hash build.sh put on every file the
           page loads. A page that looks unfixed is usually a page the
           browser kept from last time. -->
      <span>build: <strong id="build">__BUILD__</strong></span>
    </div>
    <!-- The compiled engine. A missing file here is silent — the tag 404s and
         the module below runs anyway — so it says so out loud. -->
    <script src="./docx_web.js?v=__BUILD__" onerror="window.__engineMissing = 'docx_web.js'"></script>
    <!-- And if the MODULE never runs at all — its first line imports
         ./gl/evg-webgl.js, which is not in the source directory either — the
         page just sits there with nothing in the console but a 404. This
         notices the silence. -->
    <script>
      addEventListener("load", function () {
        setTimeout(function () {
          if (window.__pageStarted) return;
          var box = document.createElement("pre");
          box.style.cssText =
            "margin:14px 0;padding:14px;background:#2b1d1d;color:#ffd9d9;border:1px solid #a33;" +
            "white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace";
          box.textContent =
            "standalone.mjs never ran \u2014 something it imports did not load.\n\n" +
            "This page needs its built form:\n\n    npm run docx_viewer:web\n\n" +
            "Then serve the dist/ directory it writes \u2014 not the source directory " +
            "this file lives in.";
          document.body.prepend(box);
          var s = document.getElementById("status");
          if (s) s.textContent = "nothing ran \u2014 see below";
        }, 1200);
      });
    </script>
    <script type="module" src="./standalone.mjs?v=__BUILD__"></script>
  </body>
</html>
